<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wendi & John Zapanta — Seoul Sep 21–25 (v2)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#d8e0ec;--txt:#1a2333;--dim:#64748b;--gold:#b8860b;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;line-height:1.55;padding:14px 12px 120px;max-width:1100px;margin:0 auto}
header{text-align:center;margin-bottom:10px}
.logo{font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
h1{font-size:22px;font-weight:800}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.map-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.map-label{font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#map{width:100%;height:230px;border-radius:8px;background:#eef2f7}
.mk{width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #0b1420;color:#0b1420;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.daybtns{display:flex;gap:6px}
.daybtns button{padding:2px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--dim);cursor:pointer;font-size:12px;font-weight:700}
.daybtns button.on{border-color:var(--gold);background:var(--gold);color:#fff}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.day-h{padding:10px 14px;background:#eaf0f8;border-bottom:1px solid var(--line);font-weight:800;font-size:14px;cursor:pointer;user-select:none}
.day.closed .slots,.day.closed .addrow{display:none}
.day-h .tg{float:right;color:var(--dim);font-weight:400;font-size:12px}
.slots{padding:8px}
.slot{background:#f0f4fa;border:1px solid var(--line);border-radius:10px;padding:9px 11px 9px 64px;margin-bottom:7px;font-size:13px;position:relative}
.slot .num{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;color:var(--gold);background:#fff;border:1px solid var(--gold);border-radius:10px;padding:0 7px;line-height:18px}
.slot .mv{position:absolute;left:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:1px 7px;cursor:pointer;font-size:14px;line-height:20px;min-width:28px;text-align:center}
.slot .mvup{top:32px}
.slot .mvdn{top:58px}
@media(min-width:640px){.slot .mv{padding:4px 10px;font-size:15px}}
.slot .n{font-weight:700}
.slot .d{color:var(--dim);font-size:12px;white-space:pre-line}
.slot .ad{font-size:11px;color:var(--dim)}
.slot .ad input{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:11px;margin-top:2px}
.slot .note{font-size:11px;color:#0b6e4f;background:#e6f6ef;border-radius:6px;padding:3px 8px;margin-top:4px;display:inline-block}
.slot .rm{position:absolute;top:6px;right:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:1px 8px;cursor:pointer;font-size:13px}
.slot .dn{font-size:11px;color:#0b6e4f;margin-top:2px}
.slot textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;font-family:inherit;margin-top:2px}
.slot input.ttl{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;font-weight:700;font-family:inherit;margin-top:2px}
.addrow{display:flex;gap:6px;margin:8px;padding:0 0 4px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.addrow button{background:var(--gold);border:0;border-radius:8px;padding:8px 14px;font-weight:800;color:#fff;cursor:pointer}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:50;max-width:1100px;margin:0 auto}
.savebar button{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;border:0}
#saveBtn{background:var(--gold);color:#fff}
#saveBtn:disabled{opacity:.5}
#status{font-size:12px;color:var(--dim);text-align:center;width:100%}
footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px}
</style>
</head>
<body>
<header>
<div class="logo">Wendi &amp; John Zapanta</div>
<h1>Seoul Schedule · Sep 21–25</h1>
<div class="sub"><span id="fbStatus">○ connecting…</span> · edits save only when you tap SAVE</div>
</header>
<div class="map-wrap">
<div class="map-label"><span>LIVE MAP — <span id="mapDayLbl"></span></span><span class="daybtns" id="mapDayBtns"></span></div>
<div id="map"></div>
<div style="font-size:11px;color:var(--dim);margin-top:6px">Numbers follow stop order · 🚇 transit times are rough estimates</div>
</div>
<div id="days"></div>
<div class="savebar"><div style="display:flex;gap:8px;width:100%;flex-wrap:wrap"><button id="saveBtn">💾 SAVE</button><div id="status"></div></div></div>
<footer>Times are rough estimates with transit buffer. Philippine Airlines T1 confirmed.</footer>
<script src="seoul-v2-config.js"></script>
<script src="seoul-v2-app.js"></script>
</body>
</html>
