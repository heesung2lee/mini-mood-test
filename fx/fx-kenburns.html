<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX-1 Ken Burns + 단어 상승 + 샤인 — Resonate Tour</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Noto Sans KR",sans-serif;background:#000;color:#fff;overflow-x:clip}
.hero-slide{position:relative;height:100svh;min-height:580px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:-6%;background:url('type-bg.jpg') center/cover;animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,1%)}}
.hero-grad{position:absolute;inset:0;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.18) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.75) 100%)}
.hero-cnt{position:relative;z-index:3;text-align:center;padding:0 24px}
.hero-eye{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#d4af37;margin-bottom:14px;text-shadow:0 1px 4px rgba(0,0,0,.85),0 2px 12px rgba(0,0,0,.6);opacity:0;animation:fadeUp .8s ease .2s forwards}
.hero-h1{position:relative;font-size:clamp(38px,7vw,70px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-bottom:12px;color:#d4af37;text-shadow:0 1px 3px rgba(0,0,0,.8),0 3px 14px rgba(0,0,0,.7),0 8px 40px rgba(0,0,0,.55),0 0 22px rgba(212,175,55,.28)}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
.w{display:inline-block;transform:translateY(115%);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{transform:translateY(0)}}
.shine-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.shine{position:absolute;top:-20%;bottom:-20%;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,250,220,.4),transparent);transform:skewX(-15deg);mix-blend-mode:screen;animation:sweep 1.1s ease 1.1s forwards}
@keyframes sweep{to{left:135%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-p{font-size:clamp(14px,2vw,19px);color:rgba(212,175,55,.95);margin-bottom:32px;line-height:1.6;text-shadow:0 1px 6px rgba(0,0,0,.85);opacity:0;animation:fadeUp 1s ease 1.7s forwards}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;opacity:0;animation:fadeUp 1s ease 2.1s forwards}
.hero-btns button{font-family:inherit;font-size:15px;font-weight:700;padding:13px 30px;border-radius:100px;cursor:pointer;border:1.5px solid #d4af37}
.btn-gold{background:#d4af37;color:#1a3450}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
@media (prefers-reduced-motion:reduce){.bg,.w,.shine,.hero-eye,.hero-p,.hero-btns{animation:none!important;opacity:1!important;transform:none!important}.shine{display:none}}
</style>
</head>
<body>
<div class="hero-slide">
<div class="bg"></div>
<div class="hero-grad"></div>
<div class="hero-cnt">
<div class="hero-eye">레조네이트 투어 · Korea → USA · 2026</div>
<h1 class="hero-h1"><span class="mask"><span class="w" style="animation-delay:.35s">캘리포니아</span></span> <span class="mask"><span class="w" style="animation-delay:.47s">골프</span></span><br><span class="mask"><span class="w" style="animation-delay:.59s">&amp;</span></span> <span class="mask"><span class="w" style="animation-delay:.71s">문화</span></span> <span class="mask"><span class="w" style="animation-delay:.83s">투어</span></span><span class="shine-wrap"><span class="shine"></span></span></h1>
<p class="hero-p">삶의 결을 따라, 당신만의 여정으로</p>
<div class="hero-btns"><button class="btn-gold">맞춤 투어 문의</button><button class="btn-ghost">코스 보기</button></div>
</div>
</div>
</body>
</html>
