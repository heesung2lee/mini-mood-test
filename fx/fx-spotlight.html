<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX-3 스포트라이트 스위프 — Resonate Tour</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Noto Sans KR",sans-serif;background:#000;color:#fff;overflow-x:clip}
.hero-slide{position:relative;height:100svh;min-height:580px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:url('type-bg.jpg') center/cover;transform:scale(1.1);animation:settle 3s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes settle{to{transform:scale(1)}}
.hero-grad{position:absolute;inset:0;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.18) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.75) 100%)}
.hero-cnt{position:relative;z-index:3;text-align:center;padding:0 24px}
.hero-eye{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#d4af37;margin-bottom:14px}
.hero-h1{font-size:clamp(38px,7vw,70px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-bottom:12px;min-height:2.3em}
.sp{display:inline-block;color:rgba(212,175,55,.22);transition:color .35s ease,text-shadow .35s ease}
.sp.lit{color:#d4af37;text-shadow:0 1px 3px rgba(0,0,0,.8),0 3px 14px rgba(0,0,0,.7),0 0 26px rgba(212,175,55,.65)}
.spot{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle 260px at var(--lx,-15%) 46%,transparent 0%,rgba(0,0,0,.78) 72%);transition:opacity .9s ease}
.spot.off{opacity:0}
.hero-p{font-size:clamp(14px,2vw,19px);color:rgba(212,175,55,.95);margin-bottom:32px;line-height:1.6;min-height:1.6em;text-shadow:0 1px 6px rgba(0,0,0,.85);opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease}
.hero-p.show{opacity:1;transform:none}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity .9s ease .2s}
.hero-btns.show{opacity:1}
.hero-btns button{font-family:inherit;font-size:15px;font-weight:700;padding:13px 30px;border-radius:100px;cursor:pointer;border:1.5px solid #d4af37}
.btn-gold{background:#d4af37;color:#1a3450}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
@media (prefers-reduced-motion:reduce){.bg{animation:none;transform:none}.sp{color:#d4af37}.spot{display:none}.hero-p,.hero-btns{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div class="hero-slide" id="slide">
<div class="bg"></div>
<div class="hero-grad"></div>
<div class="hero-cnt">
<div class="hero-eye">레조네이트 투어 · Korea → USA · 2026</div>
<h1 class="hero-h1" id="fxH1" aria-label="캘리포니아 골프 &amp; 문화 투어"></h1>
<p class="hero-p" id="fxP">삶의 결을 따라, 당신만의 여정으로</p>
<div class="hero-btns" id="fxB"><button class="btn-gold">맞춤 투어 문의</button><button class="btn-ghost">코스 보기</button></div>
</div>
<div class="spot" id="spot"></div>
</div>
<script>
(function(){
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var h1=document.getElementById('fxH1'),spot=document.getElementById('spot');
var lines=['캘리포니아 골프','& 문화 투어'];
var chars=[];
lines.forEach(function(line){
 var div=document.createElement('div');
 for(var i=0;i<line.length;i++){
  var c=line[i];
  if(c===' '){div.appendChild(document.createTextNode(' '));continue;}
  var s=document.createElement('span');
  s.className='sp';s.textContent=c;
  div.appendChild(s);chars.push(s);
 }
 h1.appendChild(div);
});
function settle(){
 spot.classList.add('off');
 document.getElementById('fxP').classList.add('show');
 document.getElementById('fxB').classList.add('show');
}
if(reduce){chars.forEach(function(s){s.classList.add('lit');});settle();return;}
var D=2400,t0=null;
function frame(t){
 if(!t0)t0=t;
 var k=Math.min((t-t0)/D,1);
 var lx=-15+k*130;
 spot.style.setProperty('--lx',lx.toFixed(1)+'%');
 var frac=k*1.08;
 chars.forEach(function(s,i){
  if(!s.classList.contains('lit')&&frac>=(i+1)/chars.length)s.classList.add('lit');
 });
 if(k<1)requestAnimationFrame(frame);
 else setTimeout(settle,350);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
