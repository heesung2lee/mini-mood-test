<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>통역</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#d4af37;--bg:#0b1220;--card:#151f33;--line:#24314d;--txt:#eef2f7;--dim:#8b98ad}
html,body{height:100%}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100dvh}
/* app header */
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
header h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
header .live{margin-left:auto;font-size:11px;font-weight:700;color:#0b1220;background:var(--gold);border-radius:20px;padding:4px 10px;display:none}
header .live.on{display:block}
/* language switch: two big tabs */
#langbar{display:flex;gap:8px;padding:14px 16px 4px}
#langbar button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:14px;padding:13px 8px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
#langbar button.act{background:var(--gold);color:#0b1220;border-color:var(--gold)}
#langbar button small{display:block;font-size:11px;font-weight:600;margin-top:2px;opacity:.75}
/* conversation */
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.5;cursor:pointer}
.msg .o{font-size:12px;opacity:.6;margin-bottom:3px}
.msg.out{align-self:flex-end;background:var(--gold);color:#0b1220;border-bottom-right-radius:6px}
.msg.out .o{opacity:.6}
.msg.in{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
#heard{background:var(--card);border:1px dashed var(--line);border-radius:12px;margin:0 16px;padding:9px 14px;font-size:14px;color:var(--dim);min-height:38px;display:none}
#heard.on{display:block}
/* bottom control deck */
#deck{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line);background:#0d1526}
#micBtn{width:100%;border:none;border-radius:16px;background:var(--gold);color:#0b1220;font-size:18px;font-weight:800;padding:17px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px}
#micBtn.live{background:#ef4444;color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.82}}
#hint{text-align:center;font-size:12px;color:var(--dim);margin-top:8px;min-height:18px}
#textRow{display:flex;gap:8px;margin-top:10px}
#textIn{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;color:#fff;padding:13px 14px;font-size:16px;font-family:inherit;outline:none}
#textIn:focus{border-color:var(--gold)}
#sendBtn{background:var(--card);border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:0 18px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
#utilRow{display:flex;gap:8px;margin-top:10px}
#utilRow button{flex:1;background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#utilRow button.on{color:var(--gold);border-color:var(--gold)}
#err{display:none;margin:0 16px 8px;background:#450a0a;color:#fca5a5;border-radius:10px;padding:10px 14px;font-size:13px}
</style>
</head>
<body>
<header><span class="dot"></span><h1>통역</h1><span id="liveTag" class="live">● 듣는 중</span></header>
<div id="langbar">
<button id="dKoEn" class="act" onclick="setDir('ko-en')">🇰🇷 한국어 → 🇺🇸 영어<small>Korean → English</small></button>
<button id="dEnKo" onclick="setDir('en-ko')">🇺🇸 영어 → 🇰🇷 한국어<small>English → Korean</small></button>
</div>
<div id="err"></div>
<div id="log"></div>
<div id="heard"></div>
<div id="deck">
<button id="micBtn" onclick="toggleMic()">🎤 탭하여 말하기</button>
<div id="hint">멈춰도 계속 듣습니다 · 다시 탭하면 종료</div>
<div id="textRow">
<input id="textIn" placeholder="텍스트 입력…" enterkeyhint="send" onkeydown="if(event.key==='Enter')sendText()">
<button id="sendBtn" onclick="sendText()">전송</button>
</div>
<div id="utilRow">
<button id="autoBtn" class="on" onclick="toggleAuto()">🔊 자동재생 ON</button>
<button onclick="clearLog()">지우기</button>
</div>
</div>
<script>
'use strict';
var dir='ko-en', rec=null, listening=false, wantListen=false, autoSpeak=true, heardTimer=null;
var SRC={'ko-en':'ko-KR','en-ko':'en-US'};
var TGT={'ko-en':'en-US','en-ko':'ko-KR'};
var TGTLANG={'ko-en':'en','en-ko':'ko'};
function setDir(d){ dir=d;
 document.getElementById('dKoEn').classList.toggle('act',d==='ko-en');
 document.getElementById('dEnKo').classList.toggle('act',d==='en-ko');
 stopAll();
 hint(d==='ko-en'?'한국어로 말하세요':'Speak in English');
}
function hint(s){ document.getElementById('hint').textContent=s; }
function showErr(s){ var e=document.getElementById('err'); e.style.display='block'; e.textContent=s; setTimeout(function(){e.style.display='none'},4000); }
function toggleAuto(){ autoSpeak=!autoSpeak; var b=document.getElementById('autoBtn'); b.textContent=autoSpeak?'🔊 자동재생 ON':'🔇 자동재생 OFF'; b.classList.toggle('on',autoSpeak); }
function clearLog(){ document.getElementById('log').innerHTML=''; }
function heardBox(txt){ var h=document.getElementById('heard'); if(!txt){h.classList.remove('on');h.textContent='';return;} h.classList.add('on'); h.textContent='… '+txt; }
/* translation: Google gtx primary, MyMemory fallback */
async function translate(text){
 var tl=TGTLANG[dir], sl=dir==='ko-en'?'ko':'en';
 try{
  var r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(text));
  var j=await r.json();
  var out=j&&j[0]?j[0].map(function(s){return s[0]}).join(''):'';
  if(out)return out; throw new Error('empty');
 }catch(e){
  var r2=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+sl+'|'+tl);
  var j2=await r2.json();
  if(j2.responseData&&j2.responseData.translatedText)return j2.responseData.translatedText;
  throw new Error('번역 실패');
 }
}
function speak(text){
 try{
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text); u.lang=TGT[dir]; u.rate=.95;
  var vs=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase().indexOf(TGT[dir].toLowerCase().slice(0,2))===0});
  var p=vs.find(function(v){return /google|natural|samantha|yuna|zira|david/i.test(v.name)});
  u.voice=p||vs[0]||null;
  speechSynthesis.speak(u);
 }catch(e){ showErr('음성재생 미지원: '+e.message); }
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); }
async function handleText(text){
 text=(text||'').trim(); if(!text)return;
 hint('번역 중…');
 try{
  var t=await translate(text);
  addMsg(text,t);
  hint(listening?'계속 듣는 중…':(dir==='ko-en'?'한국어로 말하세요':'Speak in English'));
  if(autoSpeak)speak(t);
 }catch(e){ hint('오류 발생'); showErr('번역 오류: '+e.message); }
}
function addMsg(src,tgt){
 var log=document.getElementById('log');
 var o=document.createElement('div'); o.className='msg out';
 o.innerHTML='<div class="o"></div><div></div>';
 o.children[0].textContent=src; o.children[1].textContent=tgt;
 o.onclick=function(){ speak(tgt); };
 log.appendChild(o); log.scrollTop=log.scrollHeight;
}
function sendText(){ var i=document.getElementById('textIn'); handleText(i.value); i.value=''; i.blur(); }
/* mic: continuous — auto-restart on silence until user taps stop */
function toggleMic(){ wantListen?stopAll():startLoop(); }
function startLoop(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){ showErr('Chrome · Edge · Safari에서 열어주세요'); return; }
 wantListen=true; openRec();
}
function openRec(){
 if(!wantListen)return;
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 try{ if(rec){try{rec.abort();}catch(e){}} }catch(e){}
 rec=new SR();
 rec.lang=SRC[dir]; rec.interimResults=true; rec.continuous=true;
 var seg='';
 rec.onresult=function(e){
  var inter='';
  for(var i=e.resultIndex;i<e.results.length;i++){
   var tr=e.results[i][0].transcript;
   if(e.results[i].isFinal){ seg+=' '+tr; commitSoon(); }
   else inter+=tr;
  }
  heardBox((seg+' '+inter).trim());
 };
 rec.onend=function(){ setLive(false); if(wantListen){ try{rec.start();}catch(e){ setTimeout(openRec,300); } } };
 rec.onerror=function(e){
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){ wantListen=false; setLive(false); showErr('마이크 권한을 허용해주세요'); return; }
  /* network/no-speech 등: 루프 유지, 조용히 재시작 */
  setLive(false);
  if(wantListen)setTimeout(function(){ try{rec.start();}catch(x){ openRec(); } },400);
 };
 try{ rec.start(); setLive(true); hint('듣는 중… 다시 탭하면 종료'); }
 catch(e){ showErr('마이크 시작 실패: '+e.message); wantListen=false; }
}
var commitT=null, lastCommitted='';
function commitSoon(){
 clearTimeout(commitT);
 commitT=setTimeout(function(){
  var full=document.getElementById('heard').textContent.replace(/^…\s*/,'').trim();
  if(full&&full!==lastCommitted){ lastCommitted=full; handleText(full); heardBox(''); }
 },1600);
}
function setLive(on){
 listening=on||wantListen;
 document.getElementById('micBtn').classList.toggle('live',wantListen);
 document.getElementById('micBtn').innerHTML=wantListen?'⏹ 탭하여 종료':'🎤 탭하여 말하기';
 document.getElementById('liveTag').classList.toggle('on',wantListen);
 if(!wantListen)heardBox('');
}
function stopAll(){ wantListen=false; clearTimeout(commitT); try{if(rec)rec.abort();}catch(e){} rec=null; setLive(false); }
</script>
</body>
</html>
