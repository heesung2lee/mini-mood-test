<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EN⇄KO 음성·텍스트 통역</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
h1{font-size:20px;margin:8px 0 4px}
.sub{font-size:12px;color:#94a3b8;margin-bottom:16px}
.dir{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.dir button{background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
.dir button.act{background:#d4af37;color:#0f172a;border-color:#d4af37}
#swap{background:#1e293b;border:1px solid #334155;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;color:#fff}
#log{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:38vh;overflow-y:auto}
.bubble{background:#1e293b;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.5}
.bubble .src{font-size:13px;color:#94a3b8;margin-bottom:4px}
.bubble .tgt{font-size:16px}
.bubble.en{border-left:3px solid #60a5fa}
.bubble.ko{border-left:3px solid #d4af37}
#status{font-size:13px;color:#94a3b8;min-height:20px;margin-bottom:8px;text-align:center}
#micBtn{width:96px;height:96px;border-radius:50%;border:none;background:#d4af37;font-size:40px;cursor:pointer;box-shadow:0 4px 24px rgba(212,175,55,.4)}
#micBtn.live{background:#ef4444;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#micLabel{font-size:13px;margin-top:8px;color:#cbd5e1}
#textRow{width:100%;max-width:640px;display:flex;gap:8px;margin-top:16px}
#textIn{flex:1;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;padding:12px;font-size:15px;font-family:inherit}
#sendBtn{background:#d4af37;border:none;border-radius:10px;padding:0 20px;font-size:15px;font-weight:700;cursor:pointer;color:#0f172a}
.rowBtns{display:flex;gap:8px;margin-top:12px}
.rowBtns button{background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
.err{background:#450a0a;color:#fca5a5;border-radius:10px;padding:10px 14px;font-size:13px;max-width:640px;width:100%;margin-bottom:10px;display:none}
</style>
</head>
<body>
<h1>🎙️ EN ⇄ KO 통역</h1>
<div class="sub">말하기 → 번역 → 음성 재생 · 텍스트 입력도 가능 · 무료(Web Speech API)</div>
<div class="dir">
<button id="dKoEn" class="act" onclick="setDir('ko-en')">🇰🇷→🇺🇸 한국어→영어</button>
<button id="swap" onclick="flipDir()" title="방향 전환">⇄</button>
<button id="dEnKo" onclick="setDir('en-ko')">🇺🇸→🇰🇷 영어→한국어</button>
</div>
<div id="err" class="err"></div>
<div id="log"></div>
<div id="status">아래 버튼을 눌러 말하세요</div>
<button id="micBtn" onclick="toggleMic()">🎤</button>
<div id="micLabel">탭하여 말하기</div>
<div id="textRow">
<input id="textIn" placeholder="텍스트 입력 후 전송…" onkeydown="if(event.key==='Enter')sendText()">
<button id="sendBtn" onclick="sendText()">전송</button>
</div>
<div class="rowBtns">
<button onclick="toggleAuto()">🔁 자동 음성재생: <span id="autoState">ON</span></button>
<button onclick="clearLog()">🗑 지우기</button>
</div>
<script>
'use strict';
var dir='ko-en', rec=null, listening=false, autoSpeak=true;
var SRC={ 'ko-en':'ko-KR', 'en-ko':'en-US' };
var TGT={ 'ko-en':'en-US', 'en-ko':'ko-KR' };
var TGTLANG={ 'ko-en':'en', 'en-ko':'ko' };
function setDir(d){ dir=d;
 document.getElementById('dKoEn').classList.toggle('act',d==='ko-en');
 document.getElementById('dEnKo').classList.toggle('act',d==='en-ko');
 stopMic();
 setStatus(d==='ko-en'?'한국어로 말하세요':'Speak in English');
}
function flipDir(){ setDir(dir==='ko-en'?'en-ko':'ko-en'); }
function setStatus(s){ document.getElementById('status').textContent=s; }
function showErr(s){ var e=document.getElementById('err'); e.style.display='block'; e.textContent=s; }
function toggleAuto(){ autoSpeak=!autoSpeak; document.getElementById('autoState').textContent=autoSpeak?'ON':'OFF'; }
function clearLog(){ document.getElementById('log').innerHTML=''; }
// --- translation: primary Google gtx (no key), fallback MyMemory (5k/day) ---
async function translate(text){
 var tl=TGTLANG[dir], sl=dir==='ko-en'?'ko':'en';
 try{
  var g='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(text);
  var r=await fetch(g); var j=await r.json();
  if(j&&j[0]&&j[0].map(function(s){return s[0]}).join('')) return j[0].map(function(s){return s[0]}).join('');
  throw new Error('gtx empty');
 }catch(e){
  var m='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+sl+'|'+tl;
  var r2=await fetch(m); var j2=await r2.json();
  if(j2.responseData&&j2.responseData.translatedText) return j2.responseData.translatedText;
  throw new Error('번역 실패');
 }
}
// --- speech out ---
function speak(text){
 try{
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=TGT[dir];
  var vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().indexOf(TGT[dir].toLowerCase().slice(0,2))===0);
  var pref=vs.find(v=>/google|natural|samantha|yuna|zira|david/i.test(v.name));
  if(pref)u.voice=pref; else if(vs.length)u.voice=vs[0];
  u.rate=0.95;
  speechSynthesis.speak(u);
 }catch(e){ showErr('음성재생 미지원 브라우저입니다: '+e.message); }
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); }
// --- handle final text (from mic or typed) ---
async function handleText(text){
 if(!text||!text.trim())return;
 setStatus('번역 중…');
 try{
  var t=await translate(text.trim());
  addBubble(text.trim(),t);
  setStatus(dir==='ko-en'?'한국어로 말하세요':'Speak in English');
  if(autoSpeak)speak(t);
 }catch(e){ setStatus('오류'); showErr('번역 오류: '+e.message+' (일 할당량 초과 시 내일 재시도)'); }
}
function addBubble(src,tgt){
 var log=document.getElementById('log');
 var d=document.createElement('div');
 d.className='bubble '+(dir==='ko-en'?'ko':'en');
 d.innerHTML='<div class="src"></div><div class="tgt"></div>';
 d.querySelector('.src').textContent=src;
 d.querySelector('.tgt').textContent=tgt;
 log.appendChild(d); log.scrollTop=log.scrollHeight;
 // tap bubble to replay
 d.onclick=function(){ speak(tgt); };
}
function sendText(){ var i=document.getElementById('textIn'); handleText(i.value); i.value=''; }
// --- mic ---
function toggleMic(){ listening?stopMic():startMic(); }
function startMic(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){ showErr('이 브라우저는 음성인식을 지원하지 않습니다. Chrome/Edge/Safari에서 열어주세요.'); return; }
 try{
  rec=new SR(); rec.lang=SRC[dir]; rec.interimResults=true; rec.continuous=false;
  var finalTxt='';
  rec.onresult=function(e){
   var interim='';
   for(var i=e.resultIndex;i<e.results.length;i++){
    if(e.results[i].isFinal)finalTxt+=e.results[i][0].transcript;
    else interim+=e.results[i][0].transcript;
   }
   setStatus('듣는 중: '+(finalTxt||interim||'…'));
  };
  rec.onend=function(){
   stopMicUI();
   if(finalTxt.trim())handleText(finalTxt);
   else setStatus(dir==='ko-en'?'한국어로 말하세요':'Speak in English');
  };
  rec.onerror=function(e){ stopMicUI(); showErr('음성인식 오류: '+e.error+' (마이크 권한 확인)'); };
  rec.start(); listening=true;
  document.getElementById('micBtn').classList.add('live');
  document.getElementById('micLabel').textContent='듣는 중… 다시 탭하면 중지';
  setStatus('말하세요…');
 }catch(e){ showErr('마이크 시작 실패: '+e.message); }
}
function stopMic(){ if(rec&&listening){try{rec.stop();}catch(e){}} stopMicUI(); }
function stopMicUI(){ listening=false; document.getElementById('micBtn').classList.remove('live'); document.getElementById('micLabel').textContent='탭하여 말하기'; }
</script>
</body>
</html>
