<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Translator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#d4af37;--bg:#0b1220;--card:#151f33;--line:#24314d;--txt:#eef2f7;--dim:#8b98ad}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;min-height:100dvh;max-width:900px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
header h1{font-size:17px;font-weight:800}
header .live{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:#ef4444;border-radius:20px;padding:4px 10px;display:none}
header .live.on{display:block;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.55}}
/* bottom deck: listen buttons + clear */
/* split conversation: KO left / EN right */
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.turn{display:flex;gap:8px;align-items:stretch}
.cell{flex:1;min-width:0;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.5;cursor:pointer;word-break:break-word}
.cell.ko{background:var(--card);border:1px solid var(--gold)}
.cell.en{background:#1a2b1a;border:1px solid #2f5b33}
.cell.heard{opacity:.6;border-style:dashed}
.cell .flag{font-size:10px;opacity:.6;margin-bottom:2px}
#hint{text-align:center;font-size:12px;color:var(--dim);padding:6px 16px;min-height:28px}
#deck{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line);background:#0d1526;display:flex;gap:8px}
#deck button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:14px;padding:14px 6px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
#deck button.act{background:var(--gold);color:#0b1220;border-color:var(--gold)}
#deck button.live{border-color:#ef4444;color:#ef4444}
#deck button.act.live{background:#ef4444;color:#fff;border-color:#ef4444}
#deck #clearBtn{flex:0.6;font-size:12px}
#err{display:none;margin:0 16px 8px;background:#450a0a;color:#fca5a5;border-radius:10px;padding:10px 14px;font-size:13px}
</style>
</head>
<body>
<header><span class="dot"></span><h1>🗣️ Translator</h1><span id="liveTag" class="live">● LISTENING</span></header>
<div id="err"></div>
<div id="log"></div>
<div id="hint">Tap a side, talk freely — both languages appear live</div>
<div id="deck">
<button id="btnKo" onclick="tapListen('ko')">🇰🇷🎤<br>Listen in Korean</button>
<button id="btnEn" onclick="tapListen('en')">🇺🇸🎤<br>Listen in English</button>
<button id="clearBtn" onclick="clearLog()">🧹<br>Clear</button>
</div>
<script>
'use strict';
window.addEventListener('error',function(e){showErr('Error: '+(e.message||'unknown'));});
var activeSide=null, wantListen=false, rec=null, heardRow=null, heardTimer=null;
var voicesEN=[], voiceKO=null;
/* ---------- voices: KO=Yuna fixed, EN=best native ---------- */
function normLang(l){return (l||'').replace('_','-').toLowerCase();}
function loadVoices(){
 if(!('speechSynthesis' in window))return;
 var all=speechSynthesis.getVoices()||[];
 voicesEN=all.filter(function(v){return normLang(v.lang).indexOf('en')===0;});
 voicesEN.sort(function(a,b){return rankEN(b)-rankEN(a);});
 var yuna=all.filter(function(v){return /yuna/i.test(v.name||'')&&normLang(v.lang).indexOf('ko')===0;});
 if(yuna.length)voiceKO=yuna[0];
 else{var kos=all.filter(function(v){return normLang(v.lang).indexOf('ko')===0;});voiceKO=kos[0]||null;}
}
function rankEN(v){
 var n=((v.name||'')+' '+(v.voiceURI||'')).toLowerCase(),s=0;
 if(/google us english/.test(n))s+=100;
 else if(/google uk english/.test(n))s+=85;
 else if(/samsung.*english/.test(n))s+=70;
 else if(/samantha|aria|jenny|guy|zira|david|natasha|ryan/.test(n))s+=60;
 if(/natural|neural|premium|enhanced/.test(n))s+=30;
 if(/^en-us/.test(normLang(v.lang)))s+=8;
 if(v.localService)s+=4;
 return s;
}
if('speechSynthesis' in window){
 try{speechSynthesis.getVoices();}catch(e){}
 if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;
 setTimeout(loadVoices,500);setTimeout(loadVoices,2000);
}
function speak(text,lang){
 try{
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.rate=1;
  if(lang==='ko'){u.lang='ko-KR';if(voiceKO&&normLang(voiceKO.lang).indexOf('ko')===0)u.voice=voiceKO;}
  else{u.lang='en-US';var v=voicesEN[0];if(v&&normLang(v.lang).indexOf('en')===0)u.voice=v;}
  speechSynthesis.speak(u);
 }catch(e){}
}
/* ---------- translation chain: gtx → mymemory → TITAN (Kakao) ---------- */
async function viaGtx(text,sl,tl){
 var r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(text));
 if(!r.ok)throw new Error('gtx '+r.status);
 var j=await r.json();
 var out=j&&j[0]?j[0].map(function(s){return s[0];}).join(''):'';
 if(!out)throw new Error('empty');
 return out;
}
async function viaMyMemory(text,sl,tl){
 var r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+sl+'|'+tl);
 if(!r.ok)throw new Error('mm '+r.status);
 var j=await r.json();
 if(j.responseData&&j.responseData.translatedText)return j2text(j);
 throw new Error('empty');
 function j2text(j){return j.responseData.translatedText;}
}
/* TITAN = unofficial Kakao Translate API (often more natural KO) */
async function viaTitan(text,sl,tl){
 var r=await fetch('https://titan.tiarapt.com/translate', {
  method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({text:text,source:sl==='ko'?'kr':'en',target:tl==='ko'?'kr':'en'})
 });
 if(!r.ok)throw new Error('titan '+r.status);
 var j=await r.json();
 var out=j.translatedText||j.result||j.translation||'';
 if(!out)throw new Error('empty');
 return out;
}
async function translate(text,from){
 var sl=from,tl=from==='ko'?'en':'ko';
 var errs=[];
 /* KO→EN: gtx is fine. EN→KO: try TITAN first (more natural), then gtx */
 var chain=from==='ko'?[viaGtx,viaMyMemory]:[viaTitan,viaGtx,viaMyMemory];
 for(var i=0;i<chain.length;i++){
  try{return await chain[i](text,sl,tl);}catch(e){errs.push(e.message);}
 }
 throw new Error(errs.join(' / '));
}
/* ---------- split rows ---------- */
function showErr(s){var e=document.getElementById('err');e.style.display='block';e.textContent=s;setTimeout(function(){e.style.display='none';},6000);}
function hint(s){document.getElementById('hint').textContent=s;}
function clearLog(){document.getElementById('log').innerHTML='';}
function ensureHeardRow(){
 if(heardRow&&heardRow.parentNode)return heardRow;
 var log=document.getElementById('log');
 heardRow=document.createElement('div');heardRow.className='turn';
 heardRow.innerHTML='<div class="cell ko heard"><div class="flag">🇰🇷</div><div class="tx"></div></div><div class="cell en heard"><div class="flag">🇺🇸</div><div class="tx"></div></div>';
 log.appendChild(heardRow);log.scrollTop=log.scrollHeight;
 return heardRow;
}
function clearHeardRow(){if(heardRow&&heardRow.parentNode)heardRow.parentNode.removeChild(heardRow);heardRow=null;}
function paintHeard(orig,trans,from,preview){
 var row=ensureHeardRow();
 var k=row.querySelector('.ko .tx'),e=row.querySelector('.en .tx');
 var koCell=row.querySelector('.ko'),enCell=row.querySelector('.en');
 if(from==='ko'){k.textContent=orig||preview||'';koCell.style.opacity=preview&&!orig?'0.55':'1';e.textContent=trans||'…';}
 else{e.textContent=orig||preview||'';enCell.style.opacity=preview&&!orig?'0.55':'1';k.textContent=trans||'…';}
 document.getElementById('log').scrollTop=document.getElementById('log').scrollHeight;
}
function commitRow(koText,enText){
 clearHeardRow();
 var log=document.getElementById('log');
 var d=document.createElement('div');d.className='turn';
 d.innerHTML='<div class="cell ko"><div class="flag">🇰🇷</div><div class="tx"></div></div><div class="cell en"><div class="flag">🇺🇸</div><div class="tx"></div></div>';
 d.querySelector('.ko .tx').textContent=koText;
 d.querySelector('.en .tx').textContent=enText;
 d.querySelector('.ko').onclick=function(){speak(koText,'ko');};
 d.querySelector('.en').onclick=function(){speak(enText,'en');};
 log.appendChild(d);log.scrollTop=log.scrollHeight;
 /* auto-play the OTHER side's language */
 speak(activeSide==='ko'?enText:koText,activeSide==='ko'?'en':'ko');
}
/* ---------- mic: one side at a time, pause-commits to rows ---------- */
function tapListen(side){
 if(wantListen&&activeSide===side){finishMic();return;} /* tap same side = stop+commit */
 if(wantListen)finishMicSilent();
 activeSide=side;
 paintBtns();
 try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
 wantListen=true;
 openRec();
}
function paintBtns(){
 var k=document.getElementById('btnKo'),e=document.getElementById('btnEn');
 k.classList.toggle('act',activeSide==='ko'&&!wantListen);
 e.classList.toggle('act',activeSide==='en'&&!wantListen);
 k.classList.toggle('live',wantListen&&activeSide==='ko');
 e.classList.toggle('live',wantListen&&activeSide==='en');
 k.innerHTML=(wantListen&&activeSide==='ko')?'⏹ Tap to stop':'🇰🇷🎤<br>Listen in Korean';
 e.innerHTML=(wantListen&&activeSide==='en')?'⏹ Tap to stop':'🇺🇸🎤<br>Listen in English';
 document.getElementById('liveTag').classList.toggle('on',wantListen);
}
var segBuffer='';
function openRec(){
 if(!wantListen)return;
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){showErr('Please open in Chrome, Edge, or Safari');wantListen=false;paintBtns();return;}
 try{if(rec){try{rec.abort();}catch(e){}}}catch(e){}
 rec=new SR();
 rec.lang=activeSide==='ko'?'ko-KR':'en-US';
 rec.interimResults=true;rec.continuous=true;
 rec.onresult=function(e){
  var freshFinal='',inter='';
  for(var i=e.resultIndex;i<e.results.length;i++){
   var tr=e.results[i][0].transcript;
   /* FINAL only into buffer — interim is preview only, never committed */
   if(e.results[i].isFinal)freshFinal+=' '+tr;
   else if(!freshFinal)inter=tr;
  }
  if(freshFinal){
   segBuffer=(segBuffer+freshFinal).trim();
   /* translate the pause-chunk immediately, show live in both cells */
   liveTranslate(segBuffer);
   scheduleCommit();
   paintHeard(segBuffer,null,activeSide);
  }else if(inter){
   paintHeard(segBuffer,segBuffer?null:inter,activeSide,inter);
  }
 };
 rec.onend=function(){if(wantListen)setTimeout(function(){if(wantListen)openRec();},250);};
 rec.onerror=function(e){
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){wantListen=false;showErr('Please allow microphone access');paintBtns();return;}
  if(wantListen)setTimeout(function(){if(wantListen){try{rec.start();}catch(x){openRec();}}},500);
 };
 try{rec.start();paintBtns();hint(activeSide==='ko'?'Listening Korean… tap again to stop':'Listening English… tap again to stop');}
 catch(e){showErr('Mic failed: '+e.message);wantListen=false;paintBtns();}
}
var liveToken=0;
async function liveTranslate(full){
 var my=++liveToken;
 var cur=full.trim();if(!cur)return;
 try{
  var t=await translate(cur,activeSide);
  if(my!==liveToken)return; /* stale */
  paintHeard(cur,t,activeSide);
 }catch(e){/* keep orig visible, translation on commit */}
}
function scheduleCommit(){
 clearTimeout(heardTimer);
 heardTimer=setTimeout(commitChunk,2200);
}
function commitChunk(){
 var s=segBuffer.trim();
 if(!s||!wantListen)return;
 segBuffer='';
 translate(s,activeSide).then(function(t){
  if(activeSide==='ko')commitRow(s,t);
  else commitRow(t,s);
 }).catch(function(e){showErr('Translate error: '+e.message);paintHeard(s,'⚠️',activeSide);});
}
function finishMic(){
 wantListen=false;clearTimeout(heardTimer);liveToken++;
 try{if(rec)rec.abort();}catch(e){}
 rec=null;
 var s=segBuffer.trim();segBuffer='';
 var side=activeSide;
 paintBtns();
 hint('Tap a side, talk freely — both languages appear live');
 if(s){translate(s,side).then(function(t){if(side==='ko')commitRow(s,t);else commitRow(t,s);}).catch(function(e){showErr('Translate error: '+e.message);});}
 clearHeardRow();
}
function finishMicSilent(){
 wantListen=false;clearTimeout(heardTimer);liveToken++;
 try{if(rec)rec.abort();}catch(e){}
 rec=null;segBuffer='';clearHeardRow();
}
</script>
</body>
</html>
