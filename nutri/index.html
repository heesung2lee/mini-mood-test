<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#d4af37;--bg:#0b1220;--card:#151f33;--line:#24314d;--txt:#eef2f7;--dim:#8b98ad;--good:#4ade80;--caut:#fbbf24;--avoid:#f87171}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:40px}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;font-weight:800}header p{font-size:12px;color:var(--dim);margin-top:2px}
section{padding:14px 16px}
.btn{display:block;width:100%;border:none;border-radius:12px;background:var(--gold);color:#0b1220;font-size:15px;font-weight:800;padding:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.btn.ghost{background:var(--card);border:1px solid var(--gold);color:var(--gold)}
.btn:disabled{opacity:.5}
textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px;font-size:14px;font-family:inherit;min-height:90px;margin-top:10px}
textarea:focus{border-color:var(--gold);outline:none}
#prev{width:100%;border-radius:12px;border:1px solid var(--line);display:none;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.card .nm{font-weight:800;font-size:15px}.card .one{font-size:13px;color:var(--dim);margin-top:2px}.card .tip{font-size:13px;margin-top:6px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.g{background:rgba(74,222,128,.15);color:var(--good)}.c{background:rgba(251,191,36,.15);color:var(--caut)}.a{background:rgba(248,113,113,.15);color:var(--avoid)}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.disc{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
.rel{margin-top:14px}.rel a{display:block;color:var(--gold);font-size:13px;text-decoration:none;padding:8px 0;border-bottom:1px solid var(--line)}
#spin{display:none;text-align:center;padding:20px;color:var(--gold)}
.ad{margin-top:14px;background:#101a2e;border:1px dashed var(--gold);border-radius:12px;padding:14px;font-size:13px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<header><h1>🔍 성분 스캔 <span style="font-size:11px;color:var(--gold)">TEST</span></h1><p>라벨 사진 또는 성분 텍스트 → 쉬운 해설</p></header>
<section>
<button class="btn ghost" onclick="document.getElementById('up').click()">📷 사진 찍기 / 올리기</button>
<input type="file" id="up" accept="image/*" style="display:none" onchange="picked(this)">
<img id="prev">
<div class="hint" id="ocrst"></div>
<textarea id="tx" placeholder="또는 성분표를 직접 붙여넣기 (예: 설탕, 팜유, 아스파탐, sodium nitrite …)"></textarea>
<button class="btn" id="b1" onclick="analyze()">성분 분석하기</button>
<div class="hint">테스트판: 사진 OCR 없이 텍스트 매칭으로 동작. 사진은 미리보기만. 본판에서 Vision OCR 연결.</div>
<div id="spin">⏳ 분석 중…</div>
<div id="out"></div>
<div class="rel" id="rel" style="display:none"><h3 style="font-size:14px;margin-bottom:4px">📚 관련 글</h3><div id="rell"></div></div>
<div class="ad" id="adslot" style="display:none">AD — 본판 광고 슬롯 (AdSense 승인 후)</div>

</section>

function setBtn(){
 var b=document.getElementById('b1');
 if(ocrBusy){b.disabled=true;b.textContent='⏳ 사진 읽는 중… 잠시만요';}
 else{b.disabled=false;b.textContent='성분 분석하기';}
}
function picked(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var p=document.getElementById('prev');p.src=rd.result;p.style.display='block';ocrText='';ocrBusy=true;setBtn();document.getElementById('ocrst').textContent='⏳ 사진 읽는 중… (한+영, 약 10초)';try{Tesseract.recognize(rd.result,'kor+eng').then(function(r){ocrText=r.data.text||'';ocrBusy=false;setBtn();if(ocrText){document.getElementById('ocrst').textContent='✅ 사진에서 '+ocrText.length+'자 읽음 — 자동 분석합니다';analyze();}else{document.getElementById('ocrst').textContent='⚠️ 글자를 못 읽음 — 텍스트 직접 입력';}}).catch(function(){ocrBusy=false;setBtn();document.getElementById('ocrst').textContent='⚠️ OCR 실패 — 텍스트 직접 입력';});}catch(e){ocrBusy=false;setBtn();document.getElementById('ocrst').textContent='⚠️ OCR 실패 — 텍스트 직접 입력';}};rd.readAsDataURL(f);}
function analyze(){
 var q=((document.getElementById('tx').value||'')+' '+ocrText).toLowerCase();
 if(!q.trim()){alert('사진을 올리거나 성분을 직접 입력해주세요');return;}
 document.getElementById('spin').style.display='block';
 setTimeout(function(){
  document.getElementById('spin').style.display='none';
  var hits=DB.filter(function(d){return q.indexOf(d.en.toLowerCase())>=0||q.indexOf(d.ko)>=0;});
  var out=document.getElementById('out');
  if(!hits.length){out.innerHTML='<div class="card"><div class="nm">매칭 결과 없음</div><div class="one">DB 59종에 없는 성분입니다. 본판에서 LLM이 직접 해설합니다.</div></div>';return;}
  var nG=hits.filter(function(h){return h.grade==='good';}).length;
  var nA=hits.filter(function(h){return h.grade==='avoid';}).length;
  var sum='<div class="card" style="border-color:var(--gold)"><div class="nm">총 '+hits.length+'종 발견 <span class="badge '+(nA>0?'a':(nG===hits.length?'g':'c'))+'">'+(nA>0?'주의 성분 있음':(nG===hits.length?'전체 양호':'보통'))+'</span></div><div class="one">좋음 '+nG+' · 주의·회피 '+nA+'</div></div>';
  out.textContent='';
  var sc=document.createElement('div');sc.className='card';sc.style.borderColor='var(--gold)';
  var sn=document.createElement('div');sn.className='nm';sn.textContent='총 '+hits.length+'종 발견 ';
  var sb=document.createElement('span');sb.className='badge '+(nA>0?'a':(nG===hits.length?'g':'c'));sb.textContent=(nA>0?'주의 성분 있음':(nG===hits.length?'전체 양호':'보통'));sn.appendChild(sb);sc.appendChild(sn);
  var so=document.createElement('div');so.className='one';so.textContent='좋음 '+nG+' · 주의·회피 '+nA;sc.appendChild(so);out.appendChild(sc);
  hits.forEach(function(h){
   var c=document.createElement('div');c.className='card';
   var nm=document.createElement('div');nm.className='nm';nm.textContent=h.ko+' ('+h.en+')';
   var bd=document.createElement('span');bd.className='badge '+grade2cls(h.grade);bd.textContent=grade2ko(h.grade);nm.appendChild(bd);c.appendChild(nm);
   var one=document.createElement('div');one.className='one';one.textContent=h.one;c.appendChild(one);
   var tip=document.createElement('div');tip.className='tip';tip.textContent='💡 '+h.tip;c.appendChild(tip);
   out.appendChild(c);
  });
  // related: link to infosite-style slugs
  var rels=[['설탕·당류 줄이기','sugar-guide'],['가공식품 첨가물','additives-guide'],['나트륨과 건강','sodium-guide']];
  var rl=document.getElementById('rell');rl.textContent='';rels.forEach(function(r){var a=document.createElement('a');a.href='#'+r[1];a.textContent='📄 '+r[0]+' →';rl.appendChild(a);});
  document.getElementById('rel').style.display='block';
  document.getElementById('adslot').style.display='block';
 },400);
}
</script>
</body>
</html>
