<title>성분 스캔 테스트 — NutriScan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#d4af37;--bg:#0b1220;--card:#151f33;--line:#24314d;--txt:#eef2f7;--dim:#8b98ad;--good:#4ade80;--caut:#fbbf24;--avoid:#f87171}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:40px}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;font-weight:800}header p{font-size:12px;color:var(--dim);margin-top:2px}
section{padding:14px 16px}
.btn{display:block;width:100%;border:none;border-radius:12px;background:var(--gold);color:#0b1220;font-size:15px;font-weight:800;padding:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.btn.ghost{background:var(--card);border:1px solid var(--gold);color:var(--gold)}
.btn:disabled{opacity:.5}
textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px;font-size:14px;font-family:inherit;min-height:90px;margin-top:10px}
textarea:focus{border-color:var(--gold);outline:none}
#prev{width:100%;border-radius:12px;border:1px solid var(--line);display:none;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.card .nm{font-weight:800;font-size:15px}.card .one{font-size:13px;color:var(--dim);margin-top:2px}.card .tip{font-size:13px;margin-top:6px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.g{background:rgba(74,222,128,.15);color:var(--good)}.c{background:rgba(251,191,36,.15);color:var(--caut)}.a{background:rgba(248,113,113,.15);color:var(--avoid)}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.disc{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
.rel{margin-top:14px}.rel a{display:block;color:var(--gold);font-size:13px;text-decoration:none;padding:8px 0;border-bottom:1px solid var(--line)}
#spin{display:none;text-align:center;padding:20px;color:var(--gold)}
.ad{margin-top:14px;background:#101a2e;border:1px dashed var(--gold);border-radius:12px;padding:14px;font-size:13px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<header><h1>🔍 성분 스캔 <span style="font-size:11px;color:var(--gold)">TEST</span></h1><p>라벨 사진 또는 성분 텍스트 → 쉬운 해설</p></header>
<section>

<img id="prev">
<div class="hint" id="ocrst"></div>
<textarea id="tx" placeholder="또는 성분표를 직접 붙여넣기 (예: 설탕, 팜유, 아스파탐, sodium nitrite …)"></textarea>
<button class="btn" id="b1" onclick="analyze()">성분 분석하기</button>

<div id="spin">⏳ 분석 중…</div>
<div id="out"></div>
<div class="card" id="unkcard" style="display:none"><div class="nm">모르는 성분 보내기</div><div class="one">DB에 없던 단어들입니다. 보내주시면 검토 후 다음 DB에 반영됩니다.</div><div class="one" id="unkwords" style="margin-top:6px"></div><button class="btn ghost" id="unkbtn" onclick="sendUnknown()">📤 이 단어들 보내기</button><div class="hint" id="unkst"></div></div><div class="rel" id="rel" style="display:none"><h3 style="font-size:14px;margin-bottom:4px">📚 관련 글</h3><div id="rell"></div></div>

<div class="disc">참고용 정보이며 의학적 조언이 아닙니다. 식약처 기준이 아닌 일반 가이드입니다. 질환·복용약이 있으면 의사·약사와 상담하세요.</div>
</section>

function picked(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var p=document.getElementById('prev');p.src=rd.result;p.style.display='block';ocrText='';ocrBusy=true;setBtn();document.getElementById('ocrst').textContent='⏳ 사진 읽는 중… (기기내 1차)';if(typeof Tesseract==='undefined'){serverOCR(rd.result);return;}try{Tesseract.recognize(rd.result,'kor+eng').then(function(r){var t=(r.data.text||'').trim();var ko=(t.match(/[가-힣]/g)||[]).length;if(t&&ko>=3){ocrText=t;ocrBusy=false;setBtn();document.getElementById('ocrst').textContent='✅ 사진에서 '+t.length+'자 읽음 — 자동 분석합니다';analyze();}else{serverOCR(rd.result,t);}}).catch(function(){serverOCR(rd.result,'');});}catch(e){serverOCR(rd.result,'');}};rd.readAsDataURL(f);}
function serverOCR(dataUrl, localText){document.getElementById('ocrst').textContent='⏳ 서버에서 정밀 판독 중… (약 5초)';fetch('/api/ocr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl})}).then(function(r){return r.json();}).then(function(j){ocrBusy=false;setBtn();if(j.text&&j.text.trim()){ocrText=j.text;document.getElementById('ocrst').textContent='✅ 사진에서 '+j.text.length+'자 읽음 ('+(j.source||'server')+') — 자동 분석합니다';analyze();}else if((localText||'').trim()){ocrText=localText;document.getElementById('ocrst').textContent='✅ 기기내 판독으로 분석합니다';analyze();}else{document.getElementById('ocrst').textContent='⚠️ 글자를 못 읽음 — 텍스트 직접 입력';}}).catch(function(){ocrBusy=false;setBtn();if((localText||'').trim()){ocrText=localText;document.getElementById('ocrst').textContent='✅ 기기내 판독으로 분석합니다';analyze();}else{document.getElementById('ocrst').textContent='⚠️ 서버 연결 실패 — 텍스트 직접 입력';}});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function addCard(nmHtml, badgeCls, badgeTxt, one, tip){
 var out=document.getElementById('out');
 var c=document.createElement('div');c.className='card';
 var nm=document.createElement('div');nm.className='nm';nm.innerHTML=nmHtml;
 var bd=document.createElement('span');bd.className='badge '+badgeCls;bd.textContent=badgeTxt;nm.appendChild(bd);c.appendChild(nm);
 if(one){var o=document.createElement('div');o.className='one';o.textContent=one;c.appendChild(o);}
 if(tip){var t=document.createElement('div');t.className='tip';t.textContent='\uD83D\uDCA1 '+tip;c.appendChild(t);}
 out.appendChild(c);
 return c;
}
function renderSummary(total, nG, nA){
 var out=document.getElementById('out');
 var sc=document.createElement('div');sc.className='card';sc.style.borderColor='var(--gold)';
 var sn=document.createElement('div');sn.className='nm';
 sn.textContent='\uCD1D '+total+'\uC885 \uBC1C\uACAC ';
 var sb=document.createElement('span');sb.className='badge '+(nA>0?'a':'g');sb.textContent=(nA>0?'\uC8FC\uC758 \uC131\uBD84 \uC788\uC74C':'\uC804\uCCB4 \uC591\uD638');sn.appendChild(sb);sc.appendChild(sn);
 var so=document.createElement('div');so.className='one';so.textContent='\uC88B\uC74C '+nG+' \u00B7 \uC8FC\uC758\u00B7\uD68C\uD53C '+nA;sc.appendChild(so);out.appendChild(sc);
}
function apiExplain(words, done){
 var st=document.getElementById('ocrst');
 fetch('/api/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({words:words})}).then(function(r){return r.json();}).then(function(j){
  (j.items||[]).forEach(function(h){
   addCard(esc(h.ko)+' ('+esc(h.en)+')', grade2cls(h.grade), grade2ko(h.grade), h.one, h.tip);
  });
  if(done)done((j.items||[]).length);
 }).catch(function(){
  var c=document.createElement('div');c.className='card';
  var nm=document.createElement('div');nm.className='nm';nm.textContent='\uC11C\uBC84 \uD574\uC124 \uC2E4\uD328 — \uB2E4\uC74C\uC5D0 \uB2E4\uC2DC';
  c.appendChild(nm);document.getElementById('out').appendChild(c);
  if(done)done(0);
 });
}
function analyze(){
 var q=((document.getElementById('tx').value||'')+' '+ocrText).toLowerCase();
 if(!q.trim()){alert('\uC0AC\uC9C4\uC744 \uC62C\uB9AC\uAC70\uB098 \uC131\uBD84\uC744 \uC9C1\uC811 \uC785\uB825\uD574\uC8FC\uC138\uC694');return;}
 document.getElementById('spin').style.display='block';
 document.getElementById('out').textContent='';
 document.getElementById('rel').style.display='none';
 document.getElementById('adslot').style.display='none';
 setTimeout(function(){
  document.getElementById('spin').style.display='none';
  var hits=DB.filter(function(d){return q.indexOf(d.en.toLowerCase())>=0||q.indexOf(d.ko)>=0||(d.alias&&q.indexOf(d.alias)>=0);});
  var nG=hits.filter(function(h){return h.grade==='good';}).length;
  var nA=hits.filter(function(h){return h.grade==='avoid';}).length;
  var total=hits.length;
  renderSummary(total, nG, nA);
  hits.forEach(function(h){
   addCard(esc(h.ko)+' ('+esc(h.en)+')', grade2cls(h.grade), grade2ko(h.grade), h.one, h.tip);
  });
  // unknown words -> server LLM fallback
  var toks=q.split(/[,\n\u00B7|\/\(\)\[\]]+/).map(function(w){return w.trim();}).filter(function(w){return w.length>1;});
  var unk=toks.filter(function(w){
   return !DB.some(function(d){return d.en.toLowerCase()===w||d.ko===w||(d.alias&&d.alias===w);});
  }).slice(0,12);
  showUnknown(unk);
  if(unk.length){
   var wait=document.createElement('div');wait.className='card';wait.id='llmwait';
   var nm=document.createElement('div');nm.className='nm';nm.textContent='\uD83E\uDD16 AI\uAC00 \uBD84\uC11D \uC911… ('+unk.length+'\uC885)';
   wait.appendChild(nm);document.getElementById('out').appendChild(wait);
   apiExplain(unk, function(n){
    var w=document.getElementById('llmwait');if(w)w.remove();
    // refresh summary counts to include LLM results
    var cards=document.querySelectorAll('#out .card');
    var g=0,a=0,t=0;
    cards.forEach(function(c){
     var b=c.querySelector('.badge');if(!b)return;t++;
     if(b.classList.contains('a'))a++;
     else g++;
    });
    var first=document.querySelector('#out .card .nm');
    if(first&&t){first.childNodes[0].textContent='\uCD1D '+t+'\uC885 \uBC1C\uACAC ';}
    var ones=document.querySelectorAll('#out .card .one');
    if(ones.length){ones[0].textContent='\uC88B\uC74C '+g+' \u00B7 \uC8FC\uC758\u00B7\uD68C\uD53C '+a;}
    document.getElementById('rel').style.display='block';
    document.getElementById('adslot').style.display='block';
   });
  } else {
   document.getElementById('rel').style.display='block';
   document.getElementById('adslot').style.display='block';
  }
  try{
   var rels=[['\uC124\uD0D5\u00B7\uB2F9\uB958 \uC904\uC774\uAE30','sugar-guide'],['\uAC00\uACF5\uC2DD\uD488 \uCCA8\uAC00\uBB3C','additives-guide'],['\uB098\uD2B8\uB968\uACFC \uAC74\uAC15','sodium-guide']];
   var rl=document.getElementById('rell');rl.textContent='';rels.forEach(function(r){var a=document.createElement('a');a.href='#'+r[1];a.textContent='\uD83D\uDCC4 '+r[0]+' \u2192';rl.appendChild(a);});
  }catch(e){}
 },400);
}
function showUnknown(u){
 window._lastUnknown=u||[];
 var c=document.getElementById('unkcard');if(!c)return;
 if(!u.length){c.style.display='none';return;}
 c.style.display='block';
 document.getElementById('unkwords').textContent=u.join(' \u00B7 ');
 document.getElementById('unkst').textContent='';
}
</script>
</body>
