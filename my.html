<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>my — 글 만들기</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#d8e0ec;--txt:#1a2333;--dim:#64748b;--gold:#b8860b;--navy:#1a3450}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;line-height:1.6;padding:14px 12px 120px;max-width:860px;margin:0 auto}
header{text-align:center;margin-bottom:12px}
.logo{font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
h1{font-size:22px;font-weight:800}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:800;cursor:pointer;color:var(--dim)}
.tabs button.on{border-color:var(--gold);background:var(--gold);color:#fff}
.panel{display:none}
.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;font-family:inherit}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.hint{font-size:11px;color:var(--dim);margin-top:4px}
.out{white-space:pre-wrap;font-size:13.5px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto}
.out:empty::before{content:'여기에 결과가 나옵니다';color:#aab4c4}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow button{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;border:0}
#genBtn{background:var(--gold);color:#fff}
#copyBtn{background:var(--navy);color:#fff}
#copyBtn:disabled,#genBtn:disabled{opacity:.5}
.meta{font-size:11px;color:var(--dim);margin-top:6px}
.chk{font-size:12px;margin-top:8px;line-height:1.8}
.chk .ok{color:#0b6e4f}.chk .no{color:#c0392b;font-weight:700}
footer{text-align:center;color:var(--dim);font-size:11px;margin-top:20px}
@media(min-width:640px){body{padding:20px 20px 120px}}
</style>
</head>
<body>
<header>
<div class="logo">my</div>
<h1>글 만들기</h1>
<div class="sub">네이버 FRAME · 스레드 공식 — 탭으로 구분</div>
</header>
<div class="tabs">
<button id="tabNaver" class="on" onclick="switchTab('naver')">네이버</button>
<button id="tabThreads" onclick="switchTab('threads')">스레드</button>
</div>

<div class="panel on" id="panel-naver">
<div class="card">
<h2>1 · 주제 입력</h2>
<label>주제 / 키워드</label>
<input type="text" id="nTopic" placeholder="예: 50대 혈압 관리">
<label>메모 (경험·사례·숫자 — 있을수록 강해짐)</label>
<textarea id="nMemo" placeholder="예: 아침 혈압 150, 병원 대신 집에서 잰 기록 2주"></textarea>
<div class="row">
<div><label>분량</label><select id="nLen"><option value="2200">2000~2500자 (기본)</option><option value="1200">1100~1300자 (짧게)</option></select></div>
<div><label>FAQ 개수</label><select id="nFaq"><option>5</option><option>3</option><option>7</option></select></div>
</div>
</div>
<div class="card">
<h2>2 · 결과</h2>
<div class="fmtbar" style="display:flex;gap:8px;margin-bottom:8px">
<button id="fmtNaverBlog" class="on" onclick="setNaverFmt('blog')" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer">블로그 복붙용</button>
<button id="fmtNaverDocx" onclick="setNaverFmt('docx')" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer">워드용</button>
</div>
<div class="out" id="nOut" style="user-select:text;-webkit-user-select:text"></div>
<div class="imgrow" id="nImgs" style="display:flex;gap:8px;margin-top:8px"></div>
<div class="chk" id="nChk"></div>
<div class="meta" id="nMeta"></div>
<div class="btnrow"><button id="genBtnN" onclick="genNaver()">만들기</button><button id="copyBtnN" onclick="copyOut('nOut')">복사</button><button id="dlBtnN" onclick="dlNaver()" style="background:#0b6e4f;color:#fff">다운로드</button></div>
</div>
<div class="card">
<h2>3 · 히스토리 (최근 5개)</h2>
<div id="nHist" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
</div>

<div class="panel" id="panel-threads">
<div class="card">
<h2>1 · 주제 입력</h2>
<label>주제 / 메모 / 경험 (강력한 메시지 하나가 있는 게 좋음)</label>
<textarea id="tMemo" placeholder="예: 주말에 AI로 만든 사이트, 본인만 알고 퇴사하면 회사가 인질이 된다"></textarea>
<div class="row">
<div><label>편 수</label><select id="tParts"><option>3</option><option>1</option><option>2</option><option>4</option></select></div>
<div><label>목적</label><select id="tGoal"><option value="trust">신뢰·팔로우</option><option value="share">공유·조회수</option><option value="biz">사업 연결</option></select></div>
</div>
</div>
<div class="card">
<h2>2 · 결과</h2>
<div class="out" id="tOut" style="user-select:text;-webkit-user-select:text"></div>
<div class="imgrow" id="tImgs" style="display:flex;gap:8px;margin-top:8px"></div>
<div class="chk" id="tChk"></div>
<div class="meta" id="tMeta"></div>
<div class="btnrow"><button id="genBtnT" onclick="genThreads()">만들기</button><button id="copyBtnT" onclick="copyOut('tOut')">복사</button><button id="dlBtnT" onclick="dlThreads()" style="background:#0b6e4f;color:#fff">다운로드</button></div>
</div>
<div class="card">
<h2>3 · 히스토리 (최근 5개)</h2>
<div id="tHist" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
</div>

<footer>FRAME · thread-commercial-writing 기준 내장 — my.js</footer>
<script src="my.js"></script>
</body>
</html>
