<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>✨ Photo to GIF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#d4af37;--bg:#0b1220;--card:#151f33;--line:#24314d;--txt:#eef2f7;--dim:#8b98ad}
body{font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:40px}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;font-weight:800}
header .st{margin-left:auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:#14532d;color:#86efac}
header .st.off{background:#450a0a;color:#fca5a5}
section{padding:14px 16px}
h2{font-size:14px;margin-bottom:10px;color:var(--gold)}
#prev{width:100%;border-radius:12px;border:1px solid var(--line);display:none;margin-top:10px}
#out{width:100%;border-radius:12px;border:1px solid var(--gold);display:none;margin-top:10px}
textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px;font-size:15px;font-family:inherit;min-height:60px;outline:none;resize:vertical;margin-top:10px}
textarea:focus{border-color:var(--gold)}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;border:none;border-radius:12px;background:var(--gold);color:#0b1220;font-size:15px;font-weight:800;padding:14px;cursor:pointer;font-family:inherit}
.row button:disabled{opacity:.5}
.row button.ghost{background:var(--card);border:1px solid var(--gold);color:var(--gold)}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
#err{display:none;margin:10px 16px 0;background:#450a0a;color:#fca5a5;border-radius:10px;padding:10px 14px;font-size:13px}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
nav{position:sticky;bottom:0;background:#0d1526;border-top:1px solid var(--line);display:flex;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);gap:8px}
nav a{flex:1;text-align:center;color:var(--dim);text-decoration:none;font-size:12px;font-weight:700;padding:8px;border:1px solid var(--line);border-radius:10px}
nav a.act{color:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
<header><span>✨</span><h1>Photo to GIF</h1><span id="st" class="st off">● connecting…</span></header>
<div id="err"></div>
<section>
<h2>1️⃣ Pick a photo</h2>
<div class="row"><button class="ghost" onclick="document.getElementById('up').click()">📷 Pick photo</button></div>
<input type="file" id="up" accept="image/*" style="display:none" onchange="picked(this)">
<img id="prev">
<h2 style="margin-top:14px">2️⃣ Motion prompt</h2>
<textarea id="pr" placeholder="e.g. clouds drifting, water rippling, hair swaying in wind">gentle motion, clouds drifting</textarea>
<div class="row"><button id="b1" onclick="gen()">✨ Animate (~15 min)</button></div>
<div class="hint">Runs AnimateDiff on your Mac. Takes ~15 min per GIF — keep the page open. Best: landscapes, sky, water.</div>
<img id="out">
<div class="row" id="dl" style="display:none"><button class="ghost" onclick="dlGif()">⬇ Download</button></div>
<div class="hint" id="prog" style="display:none"></div>
</section>
<section>
<h2>📁 History</h2>
<div id="hist"><div class="hint">Loading…</div></div>
</section>
<nav>
<a href="interp.html">🗣️ Translator</a>
<a href="voice-studio.html">🎙️ Studio</a>
<a href="photo-gif.html" class="act">✨ GIF</a>
</nav>
<script>
'use strict';
var API = localStorage.getItem('gif_api') || location.origin.replace(':8964',':8191');
var photoB64=null, gifB64=null;
function showErr(s){var e=document.getElementById('err');e.style.display='block';e.textContent=s;setTimeout(function(){e.style.display='none';},8000);}
async function health(){try{var r=await fetch(API+'/');if(r.ok){document.getElementById('st').textContent='● online';document.getElementById('st').classList.remove('off');return;}}catch(e){}document.getElementById('st').textContent='● offline';document.getElementById('st').classList.add('off');}
health();setInterval(health,20000);
function picked(inp){
 var f=inp.files[0];if(!f)return;
 var rd=new FileReader();
 rd.onload=function(){photoB64=rd.result.split(',')[1];var p=document.getElementById('prev');p.src=rd.result;p.style.display='block';};
 rd.readAsDataURL(f);
}
var progTimer=null;
function pollProg(){
 fetch(API+'/progress').then(function(r){return r.json();}).then(function(j){
  var el=document.getElementById('prog');el.style.display='block';
  if(j.running>0||j.pending>0)el.innerHTML='<span class="spin">⏳</span> Rendering… (queue: '+j.running+' running, '+j.pending+' waiting) — you can close this page, it keeps going.';
  else{el.innerHTML='✅ Done — check History below.';clearInterval(progTimer);loadHist();}
 }).catch(function(){});
}
function loadHist(){
 fetch(API+'/jobs').then(function(r){return r.json();}).then(function(j){
  var el=document.getElementById('hist');
  if(!j.jobs||!j.jobs.length){el.innerHTML='<div class="hint">No GIFs yet.</div>';return;}
  el.innerHTML=j.jobs.map(function(r){
   var d=new Date(r.ts*1000),ds=(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
   return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><a href="'+API+'/file?n='+encodeURIComponent(r.name)+'" target="_blank" style="flex:1;color:var(--gold);font-size:13px;text-decoration:none">🎬 '+r.name+' <span style="color:var(--dim)">'+ds+'</span><br><span style="color:var(--dim);font-size:12px">'+(r.prompt||'').slice(0,60)+'</span></a><button onclick="dlHist(\''+r.name+'\')" style="background:var(--card);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer">⬇</button></div>';
  }).join('');
 }).catch(function(){document.getElementById('hist').innerHTML='<div class="hint">Offline.</div>';});
}
function dlHist(n){
 fetch(API+'/file?n='+encodeURIComponent(n)).then(function(r){return r.blob();}).then(function(b){
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();
 });
}
loadHist();
function gen(){
 if(!photoB64)return showErr('Pick a photo first');
 var btn=document.getElementById('b1');
 btn.disabled=true;btn.innerHTML='<span class="spin">⏳</span> Animating… (~15 min, stay open)';
 progTimer=setInterval(pollProg,10000);pollProg();
 fetch(API+'/gif',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:photoB64,prompt:document.getElementById('pr').value.trim()||'gentle motion'})})
 .then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error(j.error||('http '+r.status));});return r.json();})
 .then(function(j){gifB64=j.gif;var o=document.getElementById('out');if(j.name&&j.name.endsWith('.mp4')){o.outerHTML='<video id="out" controls autoplay loop style="width:100%;border-radius:12px;border:1px solid var(--gold);margin-top:10px" src="data:video/mp4;base64,'+gifB64+'"></video>';}else{o.src='data:image/gif;base64,'+gifB64;o.style.display='block';}document.getElementById('dl').style.display='flex';clearInterval(progTimer);document.getElementById('prog').innerHTML='✅ Done.';loadHist();})
 .catch(function(e){showErr('Failed: '+e.message);});
 btn.disabled=false;btn.innerHTML='✨ Animate (~15 min)';
}
function dlGif(){
 if(!gifB64)return;
 var bin=atob(gifB64),arr=new Uint8Array(bin.length);
 for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([arr],{type:'image/gif'}));a.download='animated.gif';a.click();
}
</script>
</body>
</html>
